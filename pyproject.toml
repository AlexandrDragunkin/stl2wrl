[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stl2wrl"
version = "1.1.0"
description = "A tool to convert STL files to VRML/WRL format"
readme = "README.md"
authors = [{name = "Bradley Boccuzzi", email = "bradleyboccuzzi@example.com"}]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
requires-python = ">=3.7"
dependencies = [
    "numpy>=1.19.0",
    "numpy-stl==3.1.2",
]

[project.urls]
Homepage = "https://github.com/yourusername/stl2wrl"
Repository = "https://github.com/yourusername/stl2wrl"

[project.scripts]
stl2wrl = "stl2wrl:main"